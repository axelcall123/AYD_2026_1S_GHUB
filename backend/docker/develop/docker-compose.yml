services:
  api_ts:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    environment:
      NODE_ENV: ${APP_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_ts:5432/${POSTGRES_DB}
    ports:
      - "${PORT}:3000"
    depends_on:
      db_ts:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    networks:
      - appnet_ts
  db_ts:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_develop_ts:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appnet_ts
volumes:
  pgdata_develop_ts:
networks:
  appnet_ts:
    driver: bridge
