name: CI-CD

on:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  build-and-push:
    needs: test
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/develop/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/api-example:develop
            ghcr.io/${{ github.repository_owner }}/api-example:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          rm -f .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "APP_ENV=${{ secrets.APP_ENV }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/api-example" >> .env
          echo "IMAGE_TAG=${{ github.sha }}" >> .env
        working-directory: backend

      - name: Login to GHCR # ← agregar esto antes del pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ghcr.io/${{ github.repository_owner }}/api-example:develop

      - name: Stop containers
        run: docker compose -f backend/docker/develop/docker-compose.yml down || true

      - name: Start containers
        run: docker compose --env-file backend/.env -f backend/docker/develop/docker-compose.yml up -d

      - name: Cleanup images
        run: docker image prune -f
